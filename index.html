<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Comprovantes 58mm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            display: flex;
            gap: 30px;
            max-width: 900px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        .editor {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 380px;
        }
        h2 { font-size: 18px; margin-top: 0; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #555; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        
        .receipt {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            line-height: 1.2;
            background: #fff;
            padding: 10px;
            width: 290px;
            margin: 0 auto;
            border: 1px dashed #bbb;
            color: #000;
            letter-spacing: -0.3px;
        }
        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px dashed #000;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }
        .receipt-logo { font-weight: bold; font-size: 13px; }
        .receipt-right-info { text-align: right; font-size: 9px; }
        .receipt-reprint { text-align: center; font-size: 10px; font-weight: bold; background: #000; color: #fff; padding: 2px 0; margin: 4px 0; }
        .receipt-amount-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #000;
            padding-bottom: 6px;
            margin-bottom: 6px;
        }
        .receipt-datetime { font-size: 10px; }
        .receipt-value { font-size: 15px; font-weight: bold; text-align: right; }
        .receipt-center { text-align: center; font-weight: bold; font-size: 11px; margin: 6px 0; border-bottom: 1px dashed #000; padding-bottom: 6px; }
        .receipt-footer-grid {
            font-size: 9px;
            line-height: 1.3;
        }

        .btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <div class="editor">
        <h2>Editar Comprovante</h2>
        <div class="form-group">
            <label>Empresa / App</label>
            <input type="text" id="inp-brand" value="PagBank" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Via / AUT</label>
            <textarea id="inp-via" rows="2" oninput="updateReceipt()">VIA ESTABELECIMENTO
AUT: 314271</textarea>
        </div>
        <div class="form-group">
            <label>Status (ex: REIMPRESSAO)</label>
            <input type="text" id="inp-status" value="REIMPRESSAO" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Data e Hora</label>
            <input type="text" id="inp-datetime" value="11/NOV/2026 11:32" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Cartão (Final)</label>
            <input type="text" id="inp-card" value="************1793" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Valor (R$)</label>
            <input type="text" id="inp-value" value="22,90" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Tipo de Transação</label>
            <input type="text" id="inp-type" value="VENDA DEBITO ELO" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>Nome do Estabelecimento</label>
            <input type="text" id="inp-store" value="STEAKTOPIA" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>CNPJ</label>
            <input type="text" id="inp-cnpj" value="52.346.711/0001-16" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>CV e NSU (Lado a Lado)</label>
            <input type="text" id="inp-cv-nsu" value="CV: 712554    NSU: 41132712554" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>LABEL e SNPOS (Lado a Lado)</label>
            <input type="text" id="inp-lbl-snpos" value="LABEL: DEBITO    SNPOS: J901" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>AID</label>
            <input type="text" id="inp-aid" value="AID: A00000004942010" oninput="updateReceipt()">
        </div>
        <div class="form-group">
            <label>ARQC</label>
            <input type="text" id="inp-arqc" value="ARQC: C03308DEFEE1805E" oninput="updateReceipt()">
        </div>

        <button class="btn" onclick="printBluetooth()">🖨️ Imprimir via Web Bluetooth</button>
    </div>

    <div>
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #666; text-align: center;">Visualização (Bobina 58mm)</div>
        <div class="receipt" id="receipt-preview">
            <div class="receipt-header">
                <div>
                    <div class="receipt-logo" id="prev-brand">PagBank</div>
                </div>
                <div class="receipt-right-info" id="prev-via">
                    VIA ESTABELECIMENTO<br>AUT: 314271
                </div>
            </div>

            <div class="receipt-reprint" id="prev-status">REIMPRESSAO</div>

            <div class="receipt-amount-row">
                <div>
                    <div class="receipt-datetime" id="prev-datetime">11/NOV/2026 11:32</div>
                    <div style="font-size: 9px;" id="prev-card">************1793</div>
                </div>
                <div class="receipt-value">R$<span id="prev-value">22,90</span></div>
            </div>

            <div class="receipt-center" id="prev-type">
                VENDA DEBITO ELO
            </div>

            <div class="receipt-footer-grid">
                <strong id="prev-store">STEAKTOPIA</strong><br>
                CNPJ: <span id="prev-cnpj">52.346.711/0001-16</span><br>
                <span id="prev-cv-nsu">CV: 712554    NSU: 41132712554</span><br>
                <span id="prev-lbl-snpos">LABEL: DEBITO    SNPOS: J901</span><br>
                <span id="prev-aid">AID: A00000004942010</span><br>
                <span id="prev-arqc">ARQC: C03308DEFEE1805E</span>
            </div>
        </div>
    </div>
</div>

<script>
function updateReceipt() {
    document.getElementById('prev-brand').innerText = document.getElementById('inp-brand').value;
    document.getElementById('prev-via').innerHTML = document.getElementById('inp-via').value.replace(/\n/g, '<br>');
    document.getElementById('prev-status').innerText = document.getElementById('inp-status').value;
    document.getElementById('prev-datetime').innerText = document.getElementById('inp-datetime').value;
    document.getElementById('prev-card').innerText = document.getElementById('inp-card').value;
    document.getElementById('prev-value').innerText = document.getElementById('inp-value').value;
    document.getElementById('prev-type').innerText = document.getElementById('inp-type').value;
    document.getElementById('prev-store').innerText = document.getElementById('inp-store').value;
    document.getElementById('prev-cnpj').innerText = document.getElementById('inp-cnpj').value;
    document.getElementById('prev-cv-nsu').innerText = document.getElementById('inp-cv-nsu').value;
    document.getElementById('prev-lbl-snpos').innerText = document.getElementById('inp-lbl-snpos').value;
    document.getElementById('prev-aid').innerText = document.getElementById('inp-aid').value;
    document.getElementById('prev-arqc').innerText = document.getElementById('inp-arqc').value;
}

function buildEscPosText() {
    const brand = document.getElementById('inp-brand').value;
    const via = document.getElementById('inp-via').value.split('\n');
    const status = document.getElementById('inp-status').value;
    const datetime = document.getElementById('inp-datetime').value;
    const card = document.getElementById('inp-card').value;
    const value = "R$ " + document.getElementById('inp-value').value;
    const type = document.getElementById('inp-type').value;
    const store = document.getElementById('inp-store').value;
    const cnpj = document.getElementById('inp-cnpj').value;
    
    const cvNsu = document.getElementById('inp-cv-nsu').value;
    const lblSnpos = document.getElementById('inp-lbl-snpos').value;
    const aid = document.getElementById('inp-aid').value;
    const arqc = document.getElementById('inp-arqc').value;
    
    // Linha divisória exata de 32 colunas
    const linha = "--------------------------------";

    let escText = "\x1B\x40"; // Inicializa impressora
    
    // Cabeçalho: Nome à esquerda e Via à direita na mesma linha
    escText += "\x1B\x61\x00";
    let cabecalhoEsquerda = brand;
    let cabecalhoDireita = via[0] || "";
    let espacosCab = " ".repeat(Math.max(1, 32 - (cabecalhoEsquerda.length + cabecalhoDireita.length)));
    escText += cabecalhoEsquerda + espacosCab + cabecalhoDireita + "\n";
    
    if (via[1]) {
        let espacosAut = " ".repeat(Math.max(0, 32 - via[1].length));
        escText += espacosAut + via[1] + "\n";
    }

    if (status.trim() !== "") {
        escText += linha + "\n";
        // Faixa preta com texto invertido para o status (reimpressão)
        escText += "\x1B\x61\x01\x1D\x42\x01 " + status + " \x1D\x42\x00\x1B\x61\x00\n";
    }

    escText += linha + "\n";
    
    // Data/Cartão à esquerda e Valor ao lado direito
    escText += datetime + "\n";
    let espacosVal = " ".repeat(Math.max(1, 32 - card.length - value.length));
    escText += card + espacosVal + "\x1B\x45\x01" + value + "\x1B\x45\x00\n";
    
    escText += linha + "\n";
    
    // Tipo de Transação centralizado e em negrito
    escText += "\x1B\x61\x01\x1B\x45\x01" + type + "\x1B\x45\x00\n";
    
    escText += linha + "\n";
    
    // Dados da loja e códigos organizados sem corromper linhas
    escText += "\x1B\x61\x00";
    escText += "\x1B\x45\x01" + store + "\x1B\x45\x00\n";
    escText += "CNPJ: " + cnpj + "\n";
    escText += cvNsu + "\n";
    escText += lblSnpos + "\n";
    escText += aid + "\n";
    escText += arqc + "\n";
    
    escText += linha + "\n\n\n\n";

    return escText;
}

async function printBluetooth() {
    if (!navigator.bluetooth) {
        alert("O seu navegador não suporta Web Bluetooth.");
        return;
    }

    const printerServices = [
        '000018f0-0000-1000-8000-00805f9b34fb',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
        '0000ff00-0000-1000-8000-00805f9b34fb',
        '0000fee7-0000-1000-8000-00805f9b34fb',
        '0000ae30-0000-1000-8000-00805f9b34fb'
    ];

    try {
        const device = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: printerServices
        });

        const server = await device.gatt.connect();
        const services = await server.getPrimaryServices();

        let writeCharacteristic = null;
        for (const service of services) {
            const characteristics = await service.getCharacteristics();
            for (const char of characteristics) {
                if (char.properties.write || char.properties.writeWithoutResponse) {
                    writeCharacteristic = char;
                    break;
                }
            }
            if (writeCharacteristic) break;
        }

        if (!writeCharacteristic) {
            alert("Impressora ligada, mas o canal de escrita não foi encontrado.");
            return;
        }

        const encoder = new TextEncoder();
        const data = encoder.encode(buildEscPosText());

        const chunkSize = 20;
        for (let i = 0; i < data.length; i += chunkSize) {
            const chunk = data.slice(i, i + chunkSize);
            if (writeCharacteristic.properties.writeWithoutResponse) {
                await writeCharacteristic.writeValueWithoutResponse(chunk);
            } else {
                await writeCharacteristic.writeValue(chunk);
            }
        }

        alert("Comprovativo impresso com sucesso!");
    } catch (error) {
        console.error(error);
        alert("Erro: " + error.message + "\n\nVerifique se o Bluetooth e a Localização (GPS) estão ligados.");
    }
}
</script>

</body>
</html>
